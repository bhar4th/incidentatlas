services:
  incidentatlas:
    build: .
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - incidentatlas-data:/app/data
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  incidentatlas-data:
